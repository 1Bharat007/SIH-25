<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042c28" />
      <stop offset="50%" stop-color="#0b7365" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Mountain Peaks (Kanchenjunga Motif) -->
  <!-- Left Ridge -->
  <polygon points="60,380 180,210 270,380" fill="#0d5c52" opacity="0.6" />
  
  <!-- Right Ridge -->
  <polygon points="250,380 370,190 460,380" fill="#09907d" opacity="0.7" />

  <!-- Central Great Peak (Kanchenjunga) -->
  <polygon points="120,380 256,120 392,380" fill="url(#peakGrad)" />

  <!-- Snowcap highlight -->
  <polygon points="216,190 256,120 296,190 270,180 256,200 240,180" fill="#ffffff" />

  <!-- Sunrise / Compass Ray Circle -->
  <circle cx="256" cy="115" r="28" fill="url(#goldGrad)" />

  <!-- Offline Wireless Pulse Ring (Symbolizing Offline First & Connectivity) -->
  <path d="M190 420 A 80 80 0 0 1 322 420" stroke="#5ce8cb" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M220 445 A 45 45 0 0 1 292 445" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9" />
  <circle cx="256" cy="460" r="8" fill="#ffffff" />
</svg>
